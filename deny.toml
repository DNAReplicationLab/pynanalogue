# Dependency policy for the Python extension and its enabled features.
# License checks are intentionally outside this policy for now.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # Accept the maintenance-only advisory inherited through rust-htslib.
    # Revisit when rust-htslib replaces custom_derive; no released fix exists.
    "RUSTSEC-2025-0058", # custom_derive unmaintained
    # Source-level review found no reachable call through our current APIs.
    # See SECURITY.md: PyO3 advisory exceptions, including review triggers.
    "RUSTSEC-2026-0176", # PyList/PyTuple iterator nth/nth_back arithmetic
    "RUSTSEC-2026-0177", # PyCFunction::new_closure missing Sync bound
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
