name: Rust CI

permissions:
  contents: read

concurrency:
  group: rust-ci-no-cargo-lock-${{ github.ref }}
  cancel-in-progress: true

# We run CI after removing Cargo.lock to check if everything
# works without the lock file. If something breaks without the
# lock file i.e. due to newer packages, it's not a deal breaker,
# but we have to look into it at some point in the future.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust_checks:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup update "$TOOLCHAIN" && rustup default "$TOOLCHAIN"

      - name: remove cargo.lock
        run: rm Cargo.lock

      - name: Build
        run: cargo build --verbose

      - name: Run Rust tests
        run: cargo test --verbose

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check
