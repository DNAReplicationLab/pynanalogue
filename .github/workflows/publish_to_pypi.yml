name: Build Wheels and Publish to PyPI

permissions:
  contents: read

concurrency:
  group: pypi-publish
  # Retain up to 100 pending releases instead of replacing the pending run.
  queue: max
  # Finish an active release instead of interrupting publication.
  cancel-in-progress: false

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual triggering

jobs:
  version_check:
    name: Verify version matches release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install yq
        run: sudo snap install yq
      - name: Check versions match tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG_VERSION="${TAG#v}"
          TOML_VERSION=$(yq -p toml -oy '.package.version' Cargo.toml)
          LOCK_VERSION=$(yq -p toml -oy '.package[] | select(.name == "pynanalogue") | .version' Cargo.lock)
          PYPROJECT_VERSION=$(yq -p toml -oy '.project.version' pyproject.toml)
          echo "Tag: $TAG_VERSION | Cargo.toml: $TOML_VERSION | Cargo.lock: $LOCK_VERSION | pyproject.toml: $PYPROJECT_VERSION"
          [ "$TOML_VERSION" = "$TAG_VERSION" ] || { echo "ERROR: Cargo.toml version ($TOML_VERSION) != tag ($TAG_VERSION)"; exit 1; }
          [ "$LOCK_VERSION" = "$TAG_VERSION" ] || { echo "ERROR: Cargo.lock version ($LOCK_VERSION) != tag ($TAG_VERSION)"; exit 1; }
          [ "$PYPROJECT_VERSION" = "$TAG_VERSION" ] || { echo "ERROR: pyproject.toml version ($PYPROJECT_VERSION) != tag ($TAG_VERSION)"; exit 1; }

  build_macos_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: [version_check]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --locked --release --out dist --interpreter python3.11 --interpreter python3.12 --interpreter python3.13 --interpreter python3.14 --interpreter python3.15

      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  build_linux_wheels:
    name: Build ${{ matrix.compatibility }} wheels (${{ matrix.target }})
    needs: [version_check]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 builds
          - target: x86_64-unknown-linux-musl
            compatibility: musllinux_1_2
            runner: ubuntu-24.04
          - target: x86_64-unknown-linux-gnu
            compatibility: manylinux_2_28
            runner: ubuntu-24.04
          - target: x86_64-unknown-linux-gnu
            compatibility: manylinux_2_34
            runner: ubuntu-24.04
          - target: x86_64-unknown-linux-gnu
            compatibility: manylinux2014
            runner: ubuntu-24.04
          # ARM64 builds
          - target: aarch64-unknown-linux-musl
            compatibility: musllinux_1_2
            runner: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-gnu
            compatibility: manylinux_2_28
            runner: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-gnu
            compatibility: manylinux_2_34
            runner: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-gnu
            compatibility: manylinux2014
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Set up Rust target
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: rustup target add "$RUST_TARGET"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl \
            libssl-dev libcurl4-openssl-dev libbz2-dev liblzma-dev zlib1g-dev

      - name: Install matching clang and libclang
        run: |
          set -euo pipefail
          for version in 18 19 20 21; do
            if sudo apt-get install -y "clang-$version" "libclang-$version-dev"; then
              echo "CLANG_PATH=/usr/bin/clang-$version" >> "$GITHUB_ENV"
              echo "LIBCLANG_PATH=/usr/lib/llvm-$version/lib" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "Could not install matching clang/libclang 18-21" >&2
          exit 1

      - name: Install maturin and Zig
        run: python -m pip install maturin==1.15.0 ziglang==0.14.0 patchelf==0.19.1.0

      - name: Build wheels via cargo-zigbuild
        env:
          RUST_TARGET: ${{ matrix.target }}
          COMPATIBILITY: ${{ matrix.compatibility }}
          # libdeflate's per-function AVX-512 targets are incompatible with Zig's clang.
          CFLAGS_x86_64_unknown_linux_gnu: >-
            -DLIBDEFLATE_ASSEMBLER_DOES_NOT_SUPPORT_AVX512VNNI
            -DLIBDEFLATE_ASSEMBLER_DOES_NOT_SUPPORT_VPCLMULQDQ
          CFLAGS_x86_64_unknown_linux_musl: >-
            -DLIBDEFLATE_ASSEMBLER_DOES_NOT_SUPPORT_AVX512VNNI
            -DLIBDEFLATE_ASSEMBLER_DOES_NOT_SUPPORT_VPCLMULQDQ
        run: |
          # maturin --zig uses cargo-zigbuild and audits the requested wheel baseline.
          # abi3-py311 produces one wheel per target, usable by Python 3.11+.
          python -m maturin build --locked --release --out dist \
            --interpreter python3.11 --target "$RUST_TARGET" \
            --compatibility "$COMPATIBILITY" --zig

      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-${{ matrix.compatibility }}-${{ matrix.target }}
          path: ${{ github.workspace }}/dist/*.whl

  build_sdist:
    name: Build source distribution
    needs: [version_check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build_macos_wheels, build_linux_wheels, build_sdist]
    environment: environment_pypi
    permissions:
      id-token: write # Authenticate to PyPI using OIDC trusted publishing.
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: dist
          merge-multiple: true

      - name: List distribution files
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
