name: Python Tests (3.11-3.15 Ubuntu & Mac), Benchmarks, Linting

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        run: rustup update stable && rustup default stable

      - name: Install maturin
        run: pip install maturin

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Activate virtual environment (Unix)
        run: echo "VIRTUAL_ENV=$(pwd)/.venv" >> $GITHUB_ENV && echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Install dev dependencies
        run: pip install pytest pytest-cov pytest-benchmark

      - name: Build package in release mode
        run: maturin develop --locked --release

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=pynanalogue --cov-report=xml --cov-report=term

      - name: (disable for now) Upload coverage to Codecov
        if: false && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  benchmark_glibc:
    name: Benchmarks (glibc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Rust
        run: rustup update stable && rustup default stable

      - name: Install maturin
        run: pip install maturin

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Activate virtual environment
        run: echo "VIRTUAL_ENV=$(pwd)/.venv" >> $GITHUB_ENV && echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Install dev dependencies
        run: pip install pytest pytest-benchmark

      - name: Build package in release mode
        run: maturin develop --locked --release

      - name: Create benchmark storage directory
        run: mkdir -p "$GITHUB_WORKSPACE/benchmarks"

      - name: Run benchmarks
        run: pytest tests/ --benchmark-only --benchmark-autosave --benchmark-storage="$GITHUB_WORKSPACE/benchmarks"

      - name: Store benchmark results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-results-glibc
          path: ${{ github.workspace }}/benchmarks/*
          include-hidden-files: true
          if-no-files-found: warn

  benchmark_musl:
    name: Benchmarks (musl)
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/musllinux_1_2_x86_64@sha256:773cb7e73652e4596eba6a9d593b01278f86772641d6530a6660422d30e50f36
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          apk add --no-cache \
            bzip2-dev \
            xz-dev \
            zlib-dev \
            zlib-static \
            curl-dev \
            openssl-dev \
            build-base \
            clang20 \
            llvm \
            llvm-dev \
            clang20-dev \
            perl

      - name: Set environment variables
        run: |
          echo "CFLAGS=-I/usr/include" >> $GITHUB_ENV
          echo "CLANG_PATH=$(command -v clang)" >> $GITHUB_ENV
          libclang_path="$(find /usr -name 'libclang.so*' -o -name 'libclang-*.so*' | head -n1)"
          if [ -z "$libclang_path" ]; then
            echo "Could not locate libclang shared library" >&2
            exit 1
          fi
          echo "LIBCLANG_PATH=$(dirname "$libclang_path")" >> $GITHUB_ENV

      - name: Install maturin and Python dependencies
        run: |
          cd /opt/python/cp311-cp311/bin
          ./python3 -m pip install maturin pytest pytest-benchmark

      - name: Build package in release mode
        run: |
          . "$HOME/.cargo/env"
          /opt/python/cp311-cp311/bin/maturin build --locked --release
          /opt/python/cp311-cp311/bin/python3 -m pip install target/wheels/*.whl

      - name: Create benchmark storage directory
        run: mkdir -p "$GITHUB_WORKSPACE/benchmarks"

      - name: Run benchmarks
        run: /opt/python/cp311-cp311/bin/pytest tests/ --benchmark-only --benchmark-autosave --benchmark-storage="$GITHUB_WORKSPACE/benchmarks"

      - name: Store benchmark results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-results-musl
          path: ${{ github.workspace }}/benchmarks/*
          include-hidden-files: true
          if-no-files-found: warn

  lint:
    name: Linting & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check tests/

      - name: Check Python formatting
        run: ruff format --check tests/
